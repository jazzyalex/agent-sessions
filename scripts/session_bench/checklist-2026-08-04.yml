# Session Bench manual-gate checklist. Signal gates (S1-S3) are computed by
# evaluate.py from measurements-*.json; every verdict here is a checklist item
# with its evidence. P2 is globally untested (excluded from scoring) until a
# cross-harness truncation experiment exists.
#
# States: pass | fail | not_run (probe impossible; excluded from that agent's
# scored total) | untested (gate excluded from everyone's scored total).

gates:
  - {id: S1, area: Signal, name: Lean session, computed: true,
     desc: "The identical one-line probe task adds ≤ 10 KB to the store (incremental bytes; database cold-start allocation is reported separately, not scored)."}
  - {id: S2, area: Signal, name: Content-key share, computed: true,
     desc: "Strings under a published list of content-like keys (text, content, message, thinking, output, result, …) are ≥ 25% of stored bytes (corpus measurement). This heuristic captures real work product — messages, reasoning, tool output — but also counts bookkeeping stored under those keys, noted per-agent where known (Codex world_state, Copilot system prompt). Format-specific per-event classifiers are a 1.0 milestone."}
  - {id: S3, area: Signal, name: No fixed-cost dumps, computed: true,
     desc: "No single per-session bookkeeping record over 25 KB (system-prompt dumps, tool-catalog snapshots, context snapshots) in recent real sessions."}
  - {id: C1, area: Completeness, name: Per-event timestamps,
     desc: "Every event carries a timestamp."}
  - {id: C2, area: Completeness, name: Model attributable,
     desc: "The model behind every assistant message is recoverable from the record."}
  - {id: C3, area: Completeness, name: Token usage recorded,
     desc: "Token counts are written locally."}
  - {id: C4, area: Completeness, name: Dollar cost recorded,
     desc: "A dollar cost figure is written locally (premium-request counters do not pass)."}
  - {id: C5, area: Completeness, name: Tool calls and outputs,
     desc: "Both the tool invocation and its output are in the record."}
  - {id: C6, area: Completeness, name: Readable rationale,
     desc: "A readable account of the model's reasoning survives in the record — raw thinking or a stored summary beyond the final answer. Sealing may be deliberate vendor policy; the gate scores what the record contains, not the policy's merits."}
  - {id: C7, area: Completeness, name: Thread structure,
     desc: "Threads, branches, or subagent runs are recoverable via links or artifacts."}
  - {id: T1, area: Stability, name: No schema break,
     desc: "No breaking schema change in the observation window (2026-03-31 → 2026-08-04)."}
  - {id: T2, area: Stability, name: Declares a version,
     desc: "The artifact itself declares a format/schema version."}
  - {id: T3, area: Stability, name: Honest version signal,
     desc: "Any declared version matches the shipped reality."}
  - {id: O1, area: Openness, name: Standard-tools readable,
     desc: "Readable at rest with a text editor or sqlite3; protobuf or hex-encoded payloads fail."}
  - {id: O2, area: Openness, name: Live-tailable,
     desc: "One artifact you can tail -f holds the full running record."}
  - {id: O3, area: Openness, name: Documented schema,
     desc: "The vendor publishes documentation for the session format."}
  - {id: O4, area: Openness, name: Stable location,
     desc: "No wholesale storage-layout migration in the observation window."}
  - {id: P1, area: Tooling, name: Naive-reader safe,
     desc: "A reader following the obvious structure gets every message exactly once."}
  - {id: P2, area: Tooling, name: Crash tolerant, untested: true,
     desc: "A truncated final write costs at most one record. UNSCORED in v0.1: asserted by format family only; needs a cross-harness truncation experiment (a 1.0 milestone)."}
  - {id: P3, area: Tooling, name: Self-contained,
     desc: "No sidecar file join is needed for title, cwd, or model."}

