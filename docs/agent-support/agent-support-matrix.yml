  - "2026-06-26 session-format follow-up: bumped Codex 0.142.0->0.142.2, Claude 2.1.190->2.1.193 (additive user.origin object), and OpenCode 1.17.9->1.17.11 (additive part.compaction type plus message.assistant error/variant and part.text metadata/synthetic keys). Baseline fixtures updated; both parsers preserve unknown families via metadata/default branches, so no parser/UI change. Codex monitoring_broken was a transient codex_status_capture.sh timeout (exit 124), not format drift — fresh 0.142.2 prebump scripts/probe_scan_output/agent_watch/20260626-205841Z-prebump/report.json matched baseline. Antigravity prebump rerun with --allow-real-home stays blocked (antigravity_no_brain_artifact), verified held at 1.0.9. Weekly report scripts/probe_scan_output/agent_watch/20260626-205030Z/report.json reports matches_baseline=True with no unknown types/keys for Codex, Claude, and OpenCode."
