      - "Resources/Fixtures/stage0/agents/grok/summary.json"
      - "Resources/Fixtures/stage0/agents/grok/subagent/chat_history.jsonl"
      - "Resources/Fixtures/stage0/agents/grok/subagent/summary.json"
    evidence_tests:
      - "AgentSessionsTests/GrokSessionParserTests.swift"
      - "AgentSessionsTests/GrokSessionDiscoveryTests.swift"
    evidence_tools:
      - "scripts/grok_chat_schema_probe.py"
  qwen_code:
    max_verified_version: "0.14.3"
    version_field: "record.version"
    support_scope: "tier-2 local JSONL transcript discovery, browsing, search, Preferences controls, colors, saved-session backfill, active-session copy-resume command and launch-in-terminal resume, analytics, and weekly session-format monitoring"
    unsupported_surfaces:
      - "live/active status"
      - "usage/rate-limit tracking"
      - "images"
      - "subagent hierarchy"
      - "automatic QWEN_RUNTIME_DIR discovery (choose that runtime directory's projects folder in Settings)"
      - "resume from an arbitrarily renamed copied projects root (those transcripts remain browseable and searchable)"
      - "fresh authenticated 0.21.13 transcript and live resume validation"
      - "prebump real-session validation (no agent_watch prebump driver yet; weekly monitoring is configured)"
    notes:
      - "The installed Qwen Code CLI is 0.21.13. Its local package writer still uses projects/<project>/chats/<session-id>.jsonl and chats/archive; its own filename predicate accepts 32-36 hexadecimal-or-hyphen IDs. The user/assistant/tool_result record families are represented by synthetic fixtures. The installed help advertises --resume <id> and --continue, but its loader resolves active chats only, so archived histories are deliberately not offered resume. Model execution was authentication-blocked, so no fresh 0.21.13 transcript or end-to-end resume is claimed."
      - "THE AUTH BLOCK HAS A NAMED CAUSE AND IT IS NOT FIXABLE BY RE-LOGIN (confirmed 2026-08-17 by running `qwen -p`): 'Qwen OAuth free tier was discontinued on 2026-04-15. Run /auth to switch to Coding Plan, OpenRouter, Fireworks AI, or another provider.' That date is why the newest transcript on disk is 2026-04-13 and why ~/.qwen/oauth_creds.json expired 2026-04-19 - the account did not lapse, the tier was withdrawn. `qwen auth` is also gone as a subcommand in 0.21.x (it reports '(removed)'); provider selection is the interactive /auth flow. CONSEQUENCES, so nobody re-derives this: qwen will sit at blocked_stale_sample indefinitely, no 0.21.13 transcript can be captured, resume cannot be validated end-to-end, and no prebump driver can be built until a paid Coding Plan or an alternate provider (OpenRouter/Fireworks) is configured. That is a billing decision for the maintainer, not an engineering task."
      - "First weekly agent_watch run (2026-08-17) reported format_drift_detected, and it was an incomplete baseline rather than upstream movement: the five synthetic fixtures never modelled the systemPayload telemetry surface real transcripts carry (outputHistoryItems/systemInfo from /about, uiEvent, phase, rawCommand) or the assistant contextWindowSize and envelope gitBranch keys. Closed by sweeping both on-disk sessions with rebuild_stage0_baseline.py into system_telemetry.jsonl. uiEvent.function_args is registered opaque in _NESTED_OPAQUE_KEYS: it is the telemetry echo of a tool's own parameter object, so walking it would make every new tool parameter read as Qwen drift. Qwen was also missing from rebuild_stage0_baseline.py's MATRIX_KEY map (its section is qwen_code:), the same trap grok hit on 2026-08-13, which would have reported the entire schema missing and then failed --emit."
      - "The retained local transcript has 32 records and logs version 0.14.3. It was inspected only for keys, types, counts, and non-sensitive metadata; no production prompt, output, account identifier, project path, URL, credential, or record was copied."
      - "QWEN_HOME is honored automatically by both discovery and availability. QWEN_RUNTIME_DIR can relocate session output but is intentionally not read from the app process environment because it may be scoped only to the launched CLI; users must select its literal projects folder as the custom storage root. Copy and launch commands then carry the shell-quoted runtime parent through QWEN_RUNTIME_DIR; default-root commands remain unchanged. Arbitrarily renamed copied roots are browse-only."
      - "Current-writer systemPayload.displayText takes precedence over hook context appended to message.parts. For retained payload-less records, the current reader's exact final-part wrapper validation removes only a well-formed qwen:user-prompt-submit-context block; malformed or nested lookalikes remain visible. goal_runtime, cron, and notification user-role envelopes remain metadata rather than inflating user-turn counts or titles."
      - "Discovery and resume share an exact root-relative location invariant: only projectsRoot/<project>/chats/<id>.jsonl is active and projectsRoot/<project>/chats/archive/<id>.jsonl is archived. Nested chats lookalikes and Agent Sessions archive fallback copies are never offered resume."
      - "Current-reader compatibility reconstructs the last non-artifact parent chain, aggregates repeated-UUID fragments in physical order, recovers multiple complete JSON objects glued on one physical line, and derives the latest active-chain cwd and custom_title. Dead rewind branches and trailing artifacts do not enter the transcript, title, counts, search metadata, or resume directory."
    evidence_captures:
      - "one retained local 0.14.3 transcript (schema-only inspection; 32 records)"
    evidence_fixtures:
      - "Resources/Fixtures/stage0/agents/qwen/019f0000-0000-7000-8000-000000000001.jsonl"
      - "Resources/Fixtures/stage0/agents/qwen/019f0000-0000-7000-8000-000000000002.jsonl"
      - "Resources/Fixtures/stage0/agents/qwen/019f0000000070008000000000000003.jsonl"
      - "Resources/Fixtures/stage0/agents/qwen/019f0000-0000-7000-8000-000000000004.jsonl"
      - "Resources/Fixtures/stage0/agents/qwen/019f0000-0000-7000-8000-000000000005.jsonl"
      - "Resources/Fixtures/stage0/agents/qwen/system_telemetry.jsonl"
    evidence_tests:
      - "AgentSessionsTests/QwenIntegrationTests.swift"
