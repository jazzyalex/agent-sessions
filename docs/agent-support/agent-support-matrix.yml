  - "2026-07-13 weekly format check: bumped Codex 0.142.5->0.144.3 and Claude 2.1.202->2.1.207 after additive schema drift. Codex 0.144.x adds a `world_state` context-snapshot event (parser resolves it to .meta; added to codex small + schema_drift fixtures with a survives-parsing test). Claude subagent transcripts (~/.claude/projects/**/<parentUUID>/subagents/*.jsonl) add agentId (user/assistant/attachment) and attributionAgent (assistant) keys; added an authentic subagent fixture pair (claude/subagent/<uuid>.jsonl + <uuid>/subagents/agent-*.jsonl with a .meta.json sidecar) so the keys land where they really occur and detectSubagentInfo path-detection is exercised (testClaudeSubagentFixtureDetectsParent). Both drifts are non-breaking (unknown keys ignored, unknown types -> .meta). Bumped OpenCode 1.17.13->1.17.18 and Pi 0.80.3->0.80.6 (prebump scripts/probe_scan_output/agent_watch/20260713-172121Z-prebump/report.json, fresh_matches_baseline=True), and Antigravity 1.0.14->1.0.16 (real-home prebump scripts/probe_scan_output/agent_watch/20260713-173118Z-prebump/report.json, fresh_matches_baseline=True). Usage probes all healthy (codex_status_probe, claude_usage_probe, claude_status ok=true). Weekly report scripts/probe_scan_output/agent_watch/20260713-163616Z/report.json. Held: Copilot 1.0.65 (upstream 1.0.70 not installed), Hermes 0.17.0 (upstream 0.18.2 not installed), Cursor 2026.6.24 (upstream 2026.7.9 not installed), OpenClaw 2026.6.11 (current)."
  - "2026-07-17 weekly format check: bumped Codex 0.144.3->0.144.5 (prebump scripts/probe_scan_output/agent_watch/20260717-061144Z-prebump/report.json, fresh_matches_baseline=True, no drift) and Claude 2.1.207->2.1.211 after additive schema drift. Claude 2.1.211 adds a session-level `mode` event ({type, mode, sessionId}, observed only as mode=normal) alongside the existing permission-mode marker; 3,638 occurrences across 99 local sessions. It is non-breaking: the event carries no content, so role resolves to meta and SessionEventKind.from falls through both switches to its final `return .meta` — it is handled by the fallback, not a named case. Added to claude small + schema_drift fixtures with testClaudeSchemaDriftModeEventSurvivesParsing (passes; 24/24 Stage0GoldenFixturesTests green). NOTE: prebump cannot see this drift — `mode` is interactive-only and the claude_print one-shot driver never emits it, so prebump reported fresh_matches_baseline=True while the weekly scan of real sessions correctly flagged format_drift_detected. Treat a green prebump as necessary but not sufficient for interactive-only event families. Claude prebump required --allow-real-home (Keychain OAuth unavailable in sandbox; apiKeySource=none -> 'Not logged in'). Usage probes all healthy (codex_status_probe, claude_usage_probe, claude_status ok=true). Weekly report scripts/probe_scan_output/agent_watch/20260717-060450Z/report.json; claude prebump 20260717-061321Z-prebump. Held: Copilot 1.0.65 (upstream 1.0.71 not installed), Hermes 0.17.0 (upstream 0.18.2 not installed), Cursor 2026.6.24 (upstream 2026.7.16 not installed). Still blocked_stale_sample pending prebump: OpenCode 1.18.3, OpenClaw 2026.7.1, Pi 0.80.10."
  - "2026-07-22 full format check: bumped Codex 0.144.6->0.145.0, Claude 2.1.215->2.1.217, OpenCode 1.18.3->1.18.4, Pi 0.80.10->0.81.1, and Antigravity 1.0.16->1.1.1. All five matched baseline from fresh real-session prebump (codex/opencode/pi from sandbox; claude/antigravity required --allow-real-home for Keychain/OAuth) with no unknown types/keys; no parser, fixture, or UI change for these. Codex 0.145.0 confirms the ongoing 2026 session-format changes (session_meta gained thread_source/session_id/structured source.subagent; state_5.sqlite thread index relocated to ~/.codex/sqlite/) are already covered — AS reads rollout JSONL, not the SQLite index. FORMAT DRIFT: Copilot 1.0.65 (verified==installed) emits two additive session-level event types, session.auto_mode_resolved ({chosenModel, reasoningBucket, categoryScores, predictedLabel, confidence, candidateModels}) and session.usage_checkpoint ({totalNanoAiu, totalPremiumRequests, modelCacheState}); both use the standard envelope, carry no renderable content, and are preserved via CopilotSessionParser's default branch as .meta. Added both to copilot/schema_drift.jsonl with testCopilotAutoModeAndUsageCheckpointEventsSurviveParsing; Copilot verified stays 1.0.65 (no version change, fixture-only coverage). Usage probes all healthy (codex_status_probe, claude_usage_probe, claude_status ok=true); discovery contracts all pass. Not validated this run: Hermes (driver produced no final response), OpenClaw (auth/config error), Cursor (needs CURSOR_API_KEY, absent from real HOME) — all held at prior verified versions, no evidence of drift. Also hardened scripts/agent_watch.py so an unexecutable agent binary (a botched opencode npm install left a shebang-less stub -> Exec format error) no longer aborts the whole weekly scan (commit f1063c57). Weekly report scripts/probe_scan_output/agent_watch/20260722-042913Z/report.json; prebump reports 20260722-042605Z-prebump (codex), 20260722-043446Z-prebump (all), 20260722-044346Z-prebump (real-home)."
  - "2026-07-22 Cursor follow-up: after logging into the Cursor CLI, cursor-agent auto-updated 2026.6.24->2026.7.20; a fresh --allow-real-home prebump (scripts/probe_scan_output/agent_watch/20260722-050027Z-prebump/report.json) reports ok=True, fresh_matches_baseline=True, unknown_types=[]/unknown_keys={}, is_stale=false. Bumped verified Cursor 2026.6.24->2026.7.20; no drift, no fixture change. Also fixed the crashing ~/.local/bin/cursor shim (set -eu + unguarded $1 on no-arg invocation -> `line 26: $1: unbound variable`); changed \"$1\" to \"${1:-}\". Cursor is now the only earlier auth-blocked agent validated fresh; Hermes and OpenClaw remain held (driver/auth, no drift evidence)."
  - "2026-07-25: added Kimi Code (Moonshot AI `kimi`) tier-2 local support and weekly session-format monitoring, verified at CLI 0.29.1. Storage is JSONL: ~/.kimi-code/sessions/wd_<slug>_<sha256[0:12]>/<sessionId>/agents/<agentId>/wire.jsonl, with a per-session state.json sidecar (title/isCustomTitle/workDir/lastPrompt) and a root session_index.jsonl. Only agents/main is discovered; sibling agent dirs are subagent journals and are excluded. Line 1 is a {type:metadata, protocol_version, created_at} envelope; later lines are flattened ops {type, ...payload, time(epoch ms)}. Conversation content is context.append_message carrying role/content-parts/toolCalls. TWO FACTS ONLY A REAL CAPTURE SHOWED: (1) the installed CLI emits protocol_version 1.4, NOT the 1.5 constant in packages/agent-core-v2/src/wire/migration/migration.ts at source HEAD - monitor the emitted value; (2) config.update carries modelAlias (\"moonshot-ai/kimi-k2.7-code\"), never a bare model key, while llm.request carries both modelAlias and concrete model (\"kimi-k2.7-code\") - a parser reading only `model` yields a nil model for every Kimi session (fixed, regression test testResolvesModelFromModelAliasNotBareModelKey). Session dirs are prefixed session_<uuid> and `kimi -S session_<uuid>` was confirmed against the real CLI to resolve that id. packages/minidb is a bespoke binary Bitcask-style KV store but is gated behind persistence_minidb_readmodel (default:false) and is only a derived read model, so AS deliberately reads wire.jsonl and does NOT implement a minidb reader. Kimi Desktop is an Electron thin client over the same daemon and the same ~/.kimi-code home, so it is a per-session surface label, not a separate source. FIXTURE GAP: the capture account was suspended for insufficient balance (429 provider.rate_limit), so the fixture contains no assistant message and no tool call; the .assistant/.tool_call/.tool_result parser paths remain unexercised by fixture and should be re-captured. No prebump driver yet: kimi -p is a real headless mode so one IS buildable, but drivers are Python classes in DRIVERS in scripts/agent_watch_prebump_drivers.py and that is its own task; weekly local_schema is the drift signal. Analytics, Copy Resume Command, and launch-in-terminal resume are supported; live status and usage/quota tracking remain unsupported. Verified 0.29.2: the CLI auto-updated 0.29.1->0.29.2 mid-session and the live journal still matched the fixture baseline with zero unknown types/keys. One family DID drift and is now covered: permission.set_mode ({mode,time,type}) was absent from the first capture; it is additive, carries no renderable content, resolves to .meta via the parser fallback, and was appended to the fixture baseline with coverage in testNonMessageOpFamiliesSurviveAsMeta. Adding kimi to agent_watch.py required four hardcoded maps (verified_map, two matrix_key maps, and the JSONL-fingerprint agent tuple in _baseline_type_keys_for_agent) - a new JSONL agent is not config-only."
  - "2026-08-01: Kimi fixture gap CLOSED, and closing it exposed a parser defect. CORRECTION to the 2026-07-25 note above: \"Conversation content is context.append_message carrying role/content-parts/toolCalls\" is WRONG - that shape is Kimi's internal Message type, not what the journal emits. Real journals split conversation across TWO op families: context.append_message holds USER TURNS ONLY (23 of 23 ops across seven captures were role:user, none carried toolCalls), while context.append_loop_event holds everything the model produced - {type:content.part, part:{type:text|think}} for assistant text and reasoning, {type:tool.call, toolCallId, name, args, description, display} and {type:tool.result, parentUuid, toolCallId, result:{output[, isError][, note]}} for tools. KimiSessionParser only read context.append_message, so its .assistant/.tool_call/.tool_result branches were unreachable against real data and every Kimi transcript rendered as user turns alone: the new fixture's session surfaced 13 of its 57 real events, and the Analytics message counts added in the Kimi/Pi analytics work counted only those 13. Fixed by parsing loop events (content.part text -> .assistant, think dropped as reasoning per the existing textContent rule; tool.call -> .tool_call with args serialised via sortedKeys; tool.result -> .tool_result, or .error when the NESTED result.isError is true - there is no top-level error flag). The earlier \"account suspended, cannot capture\" blocker was a false negative from checking only context.append_message; no funded re-capture was needed, the material was already on disk. New fixture assistant_tools.jsonl + assistant_tools.state.json is a 200-line redacted authentic capture (6 assistant replies, 19 tool calls over Bash/Agent/Glob/Write/ExitPlanMode/Read/Grep, one isError result, two note results, multi-call steps, plan mode, full compaction); redaction matches small.jsonl (system prompt + tools snapshot trimmed, home/workdir rewritten to the as-agent-lab sandbox path, long payloads clipped). It also extends the weekly baseline with seven op families small.jsonl never had: usage.record, permission.record_approval_result, plan_mode.enter/exit, full_compaction.begin/complete, context.apply_compaction. KNOWN BLIND SPOT: _jsonl_schema_fingerprint keys only on the TOP-LEVEL type, so it cannot see drift inside event.* - a new content.part part type or tool.result key would not be flagged; loop-event internals are covered by KimiSessionParserTests, not by the weekly scan."
  - "2026-08-03: Kimi integration surfaces completed; three defects from the tier-2 merge fixed. CORRECTION to the 2026-07-25 note above: \"launch-in-terminal resume remain unsupported\" is NO LONGER TRUE - Kimi now has the full resume stack (KimiResumeCoordinator/KimiTerminalLauncher/KimiResumeTypes) mirroring Pi, reaching Terminal.app, iTerm2, Warp, and Warp Preview via the shared AgentTerminalLauncher. Policy is sessionThenContinue: `--session <id>` when the CLI advertises it and the session carries an id, else `--continue` for the working directory; there is no `--resume` flag in Kimi, so unlike Pi/Cursor there is no resumeByID strategy and no supportsResume capability to probe. Live status, analytics token accounting, and usage/quota tracking remain unsupported. THE THREE DEFECTS, all of them integration-surface omissions the exhaustive-switch discipline could not catch because each site was a hand-maintained list rather than a switch: (1) NO PREFERENCES PANE - PreferencesTab had no .kimi case, so KimiSessionsRootOverride had three readers (KimiSessionIndexer, AgentEnablement.isAvailable, SessionArchiveManager) and ZERO writers anywhere in the app. Plan Task 7 Step 2 had explicitly required this row; the merge left `// Tier-2: no CLI resume/binary-probe UI for Kimi yet` stubs at three PreferencesView switch sites instead. Now a full Pi-parity pane (PreferencesView+Kimi.swift) with binary Auto/Custom picker, version probe, Check Version/Copy Path/Reveal, availability status, default root, and the storage-root override. (2) NO TOOLBAR FILTER PILL - enabledOtherAgentSpecs in UnifiedSessionsView ended at the Pi arm, so with Kimi enabled there was no pill AND no Agents-overflow entry, leaving includeKimi (default true, persisted at IncludeKimiSessions, fully plumbed through search and the indexer) untogglable; it also undercounted enabledAgentCount so the pills-to-overflow collapse fired one agent late. Kimi takes no keyboard shortcut - Cmd-1..9 are fully allocated (Codex=1, Claude=2 ... Pi=9), same posture as Hermes. (3) HAS-COMMANDS FILTER - the quick filter's JSONL-provider list omitted .kimi, so Kimi sessions fell through to the trailing `return true` and passed the filter with zero tool calls. Predicate extracted to UnifiedSessionIndexer.passesHasCommandsFilter, matching the passesLowMessageVisibilityFilter static beside it, which makes it both testable and exhaustive so the twelfth source cannot repeat this. Also wired KimiSettings into copy-resume, which had hardcoded binaryCommand \"kimi\" and would have made the new binary picker inert. New KimiCLIEnvironment.swift finally lands the file plan Task 8 specified but never created. Coverage: KimiIntegrationSurfaceTests (8) + KimiResumeCoordinatorTests (8); the has-commands regressions were confirmed to fail against the old behaviour before the fix landed."
  - "2026-08-03 full format check: bumped Codex 0.145.0->0.146.0, Claude 2.1.217->2.1.220, OpenCode 1.18.4->1.18.11, Pi 0.81.1->0.83.0, all from fresh prebump. Also bumped Copilot 1.0.65->1.0.77 after fixing its prebump driver (it passed the deprecated --config-dir and its declared credential file ~/.copilot/hosts.json no longer exists, so with no GITHUB_TOKEN exported it had no auth path at all; now sets COPILOT_HOME and falls back to `gh auth token`). The working driver immediately found real 1.0.77 drift: rte/encryptedContent on message+tool events, interactionId on system.message, and eight new auto-router telemetry keys - all additive. Claude also moved to nested fingerprinting, exposing its usage struct (cache_creation, server_tool_use, iterations, service_tier, inference_geo, speed) and ten attachment subtypes; that work exposed a walker defect where only the FIRST dict of a list was sampled, hiding Claude's heterogeneous message.content blocks. HELD: OpenClaw 2026.6.11 (missing-provider-auth; shares Codex OAuth store, real-HOME gives refresh_token_reused 401), Antigravity 1.1.1 (only rich session predates the 1.1.10 upgrade), Hermes 0.17.0 (thin sample). PARSER FIX: Antigravity CODE_ACTION/SEARCH_WEB now render as .tool_result instead of system .meta, and truncated_fields is surfaced instead of silently dropped. PRICING FIX: codex-auto-review had no price key and bills real tokens, which DELETED whole sessions from the $ runway (any unpriceable contributing slice nils the session); added at gpt-5.6/sol rates to prices.json + bundledJSON. MONITORING REBUILD: the fingerprint was blind to every nested payload (codex fingerprinted as {payload,timestamp,type}), so the token_count/rate_limits usage channel monitoring.md claimed to watch was never actually watched; added nested fingerprinting at depth 3 with opaque-key and discriminator-depth guards (codex patch_apply_end.changes is keyed by absolute file path and was leaking real user paths into reports). Weekly now unions the newest 5 sessions - single-session sampling let a 4-line prebump hello mask antigravity drift entirely - with a blocked_thin_sample verdict gated on low coverage AND low volume. Baseline convention fixed: verified-and-handled types go in the normal fixture, not schema_drift.jsonl, which is why Copilot's two 2026-07-22 types had re-reported as drift every week since. codex/small.jsonl and copilot/small.jsonl rebuilt at modern shape; 1837 tests pass. Weekly scripts/probe_scan_output/agent_watch/20260803-211811Z/report.json."
  - "2026-08-13 full format check + GROK ADDED AS THE 11TH MONITORED AGENT. Grok shipped in the app with zero agent_watch coverage; it now has a weekly fingerprint that treats a session as the DIRECTORY it is (chat_history.jsonl nested to depth 3, merged with the sibling summary.json as a `summary` bucket), a grok-build Homebrew cask upstream source, and a grok_update_check probe. BUMPED: Codex 0.146.0->0.147.0, Copilot 1.0.77->1.0.79, Cursor 2026.7.20->2026.8.11, Antigravity 1.1.1->1.1.12 (held since 2026-08-03), OpenCode 1.18.11->1.18.16, Pi 0.83.0->0.84.1, Kimi 0.31.1->0.34.0, OpenClaw 2026.6.11->2026.7.1. Claude stays 2.1.220 (upstream 2.1.232 is not installed); Hermes stays 0.17.0. Every agent now reports unknown_types=[] and unknown_keys={}. THE PREBUMP EARNED ITS KEEP TWICE: a fresh stable-0.147.0 codex session emitted world_state.state.orchestrator_skills, multi_agent_usage_hint and multi_agent_mode.usage_hint_hash that appear in ZERO of the 1184 sessions on disk (including 33 on the immediately-prior alpha); and building Kimi's first-ever prebump driver exposed profile.bind + turn.ended + event.step.end{providerFinishReason,rawFinishReason} present in EVERY kimi session, which blocked_stale_sample had been hiding because staleness short-circuits the schema verdict. INSTRUMENT FIXES: (1) a passing prebump replaces the weekly schema_diff with its own one-prompt session, and the thin-sample gate scored only that - so codex reported blocked_thin_sample off a 20-event prebump while its weekly union held 2808 clean events; thinness is now judged across every sample and pinned by tests. (2) real_home_session prebump sessions land in the real store and enter the newest-5 window, so 'Say hello' prompts were actively degrading the next weekly sample (two of them dropped antigravity to 24 events and a genuine blocked_thin_sample); antigravity/cursor/openclaw now use a tool-using prompt, hermes was left alone because it fails with either prompt. (3) Antigravity finally has an upstream source - its own auto-updater endpoint, extracted from the agy binary, which answers 'Stable Version: 1.1.12'; latest_unknown was never a property of the agent, just a missing config. NO PARSER CHANGES WERE NEEDED: claude thinking_tokens is a SUBSET of output_tokens (verified on 143 records) so the Runway is right to ignore it; antigravity GENERIC, kimi profile.bind/turn.ended and codex world_state all resolve to .meta by design. ONE LATENT RISK LOGGED: the Copilot parser never reads data.messageId, so if Copilot ever emits chunkCount>1 the fragments will render as separate assistant bubbles (every record on disk is 0/1 today). OPENCLAW IS BROKEN FOR THE USER, NOT JUST FOR US: its only model routes through an agentRuntime 'codex' harness whose @openclaw/codex plugin is not installed, on top of an expired openai:default token. 1897 Swift + 138 python tests pass. Weekly scripts/probe_scan_output/agent_watch/20260814-000832Z/report.json."
