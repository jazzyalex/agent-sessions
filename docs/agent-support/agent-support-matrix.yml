  grok_cli:
    max_verified_version: "1.0.4"
    version_field: "not_logged"
    support_scope: "tier-2 local JSONL transcript discovery, browsing, search, Preferences controls, colors, copy-resume command, launch-in-terminal resume, analytics, and subagent hierarchy"
    unsupported_surfaces:
      - "live/active status"
      - "usage/rate-limit tracking"
    notes:
      - "Prebump real-session validation added 2026-08-17 (driver `grok_single`), which is what lifted Grok from a permanent supports_installed_only cap to supports_latest. It runs `grok -p` headless with a pinned --session-id inside a sandbox HOME and a sandbox --cwd, so the percent-encoded workdir bucket is predictable and no real repository is ever the session's cwd. Grok exposes no api-key env var (only GROK_SANDBOX), so auth is always the credential-file copy of ~/.grok/auth.json - an OAuth record carrying account PII alongside the token, hence credential_file with the strict 0600 gate, never support_file. The driver verifies the sibling summary.json exists before reporting ok: a Grok session is a directory, and returning a transcript whose sidecar never landed would hand the fingerprinter half a session and surface the gap as schema drift."
      - "Weekly agent_watch monitoring added 2026-08-13: nested fingerprint over <session>/chat_history.jsonl merged with the sibling summary.json (bucket `summary`), plus a `grok_update_check` probe for authoritative latest. Latest source is the grok-build Homebrew cask JSON — Grok ships a native x.ai binary, not npm."
      - "Subagent hierarchy resolves from the parent's tree, not the child's sidecar: a spawned run is written both as a top-level session directory and as <parent>/subagents/<childId>/meta.json, which is the only place parent_session_id and subagent_type appear. Verified across 9 subagent links at 1.0.3."
      - "Grok's own `grok sessions list` hides subagent sessions; Agent Sessions surfaces them with parentage."
      - "Nesting was not observed: a subagent asked to delegate produced further subagents recorded under the root session, and no child owned its own subagents/ tree."
      - "Not yet exercised against real captures: the truncated-preview count fallback (no session has reached the 200-line preview cap; the largest seen is 167 lines) and the compaction/ subtree."
    evidence_docs:
      - "grok --help at 1.0.3 (1a29d5bc12d4)"
    evidence_captures:
      - "~/.grok/sessions/<percent-encoded workdir>/<sessionId>/ (141 sessions surveyed at 1.0.0; 13 sessions across 2 workdir buckets at 1.0.3, including 9 subagents, web-search backend_tool_call, and an image content part)"
