          notes: "Bumped 2026.6.11->2026.7.1 on WEEKLY LOCAL EVIDENCE, not a driver run - state this plainly, it is a weaker basis than every other bump in this entry. The evidence is a real user session written 2026-07-22, after the installed binary's 2026-07-20 mtime (openclaw does not log its version in sessions, so binary-mtime ordering is the only version evidence available), fingerprinting clean with unknown_types=[] and unknown_keys={} and not stale. Verdict is supports_installed_only with scope=installed; it is deliberately NOT claimed as latest despite installed == upstream, because no driver run backs it. THE DRIVER BLOCKER CHANGED and is now worse than auth: prebump fails MissingAgentHarnessError: Requested agent harness \"codex\" is not registered, before auth is even reached. ~/.openclaw/openclaw.json routes its ONLY model (openai/gpt-5.4) through agentRuntime.id \"codex\", and that harness ships in the external, non-bundled @openclaw/codex package, which is not installed (openclaw doctor: 'plugin not installed: codex'; the stock codex-supervisor plugin is a different thing and is disabled). This is machine-wide, verified against the real environment with no sandbox - meaning THE USER'S OWN main AGENT IS CURRENTLY BROKEN for its only configured model, not just our probe. Underneath it openclaw models status still reports openai:default expired, so installing the plugin alone would resurface the previously-documented dead-token failure. Human fix, both interactive: `openclaw plugins install @openclaw/codex`, then `openclaw models auth login --provider openai`. We deliberately did NOT reroute the probe to another model to make it pass - that would have hidden a real user-facing breakage. CORRECTION to earlier entries' shorthand: openclaw never read ~/.codex/auth.json; it has always kept its own auth profile for the same OpenAI account."
