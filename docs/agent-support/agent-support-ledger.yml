# Agent Support Ledger (Append-Only)
#
# This file is the durable, versioned record of what Agent Sessions (AS) verified.
# Add a new entry for each AS release going forward. Do not rewrite history.
#
# Notes:
# - Some agents do not embed their own version in sessions. For those, store the
#   verified CLI version observed during evidence capture.
# - Claude + Codex include separate "usage/limits" channels which must be monitored.
#
entries:
  - agent_sessions_version: "4.7"
    as_of_date_utc: "2026-08-13"
    as_of_commit: "b6fe38d6"
    verified:
      grok:
        sessions:
          max_verified_version: "1.0.3"
          scope: "weekly session-format monitoring added; tier-2 app support unchanged"
          evidence: ["Resources/Fixtures/stage0/agents/grok/chat_history.jsonl", "Resources/Fixtures/stage0/agents/grok/summary.json", "scripts/probe_scan_output/agent_watch/20260814-000051Z/report.json"]
          notes: "FIRST monitored run. Grok shipped in the app with no agent_watch coverage at all - the matrix listed 'weekly session-format monitoring (no agent_watch driver yet)' as an unsupported surface. A Grok session is a DIRECTORY, so _grok_session_schema_fingerprint fingerprints <session>/chat_history.jsonl NESTED (depth 3) and merges the sibling summary.json as a `summary` bucket; fingerprinting only the transcript would have left everything discovery depends on (info.id, info.cwd, current_model_id, chat_format_version) unwatched. Nested was the right call and cost nothing: flat would have hidden the content-part types (user.content:text/:image) and backend_tool_call.kind.action, which is where the format actually moves. `arguments` is the only opaque key (a tool's parameter object). Latest source is the grok-build Homebrew cask JSON - Grok ships a native x.ai binary, not npm - with a grok_update_check probe recording the CLI's own authoritative `latest:` line. First run found real additive drift the fixture predated: summary.json gained session_kind (\"subagent\", present on 9 of 13 local sessions and ABSENT on top-level ones), last_turn_summary, and last_turn_summary_prompt_id (byte-identical to that file's request_id in all 4 sessions carrying it). Sweeping all 13 local sessions - stricter than weekly's newest-5 - also closed prior_turn_interrupt, backend_tool_call id/status/sources, and the flat {type,url} image content part real sessions actually emit. Zero Swift references to any of these keys (Sidecar is a plain Decodable with explicit CodingKeys), so no parser change. STILL UNWATCHED: subagents/<childId>/meta.json, the only place parent_session_id and subagent_type appear and therefore what the hierarchy feature depends on, plus the compaction/ subtree - no fixture covers either."
      codex:
        sessions:
          max_verified_version: "0.147.0"
          evidence: ["Resources/Fixtures/stage0/agents/codex/small.jsonl", "scripts/probe_scan_output/agent_watch/20260813-233609Z-prebump/report.json", "scripts/probe_scan_output/agent_watch/20260813-233629Z-prebump/report.json"]
          notes: "Bumped from TWO independent fresh sandboxed prebumps (each generates a new session, so a pass proves the fixture generalises rather than fitting one file). The weekly sweep of all 1184 on-disk sessions closed 8 (bucket,key) pairs from Codex's new multi-agent feature: world_state.state.collaboration_mode{mode,model} and .permissions{approved_command_prefixes,instructions} (both read as unknown_TYPES only because they changed from scalar to object), compacted.payload.replacement_history{author,recipient} + .content.encrypted_content (sub-agent-to-agent messages), and mcp_tool_call_end.read_only_hint. THEN the prebump caught what 1184 on-disk sessions could not: a fresh stable-0.147.0 session emits world_state.state.orchestrator_skills{enabled,includeInstructions}, multi_agent_usage_hint, and multi_agent_mode.usage_hint_hash - ZERO occurrences on disk, including the 33 sessions run on the immediately-prior 0.147.0-alpha.6.6 build. That is the whole argument for prebump in one finding. NOT A RENAME: multi_agent_mode and collaboration_mode coexist (different concepts - sub-agent delegation gating vs session collaboration/model settings); collaboration_mode entered world_state.state around 0.146.0-alpha.3, multi_agent_mode was ADDED alongside it at 0.146.0-alpha.9.2, and the old key still appears in sessions from today. No parser change: SessionIndexer.parseLine extracts a fixed allowlist and preserves the rest in rawJSON, and encrypted_content already had byte-level defense in sanitizeCodexHugeFields."
      claude:
        sessions:
          max_verified_version: "2.1.220"
          evidence: ["Resources/Fixtures/stage0/agents/claude/small.jsonl", "scripts/probe_scan_output/agent_watch/20260814-000051Z/report.json"]
          notes: "NOT bumped - 2.1.220 is still what is installed; upstream moved to 2.1.232 during the session but an uninstalled build cannot be verified. Fixture drift closed from the full 1941-session sweep: usage.output_tokens_details{thinking_tokens} (the reported drift) plus attachment:budget_usd{used,total,remaining} and attachment:hook_blocking_error{hookName,toolUseID,hookEvent,blockingError{blockingError,command}}. THINKING_TOKENS IS A SUBSET OF output_tokens, NOT AN ADDEND - verified directly against 143 local records where thinking_tokens is always <= output_tokens and frequently 0 while output is large. The Runway therefore stays correct by IGNORING it, exactly as it already ignores Codex's reasoning_output_tokens (CodexRunwayModel documents that precedent); counting it would double-bill. No parser or price-table change."
      kimi:
        sessions:
          max_verified_version: "0.34.0"
          evidence: ["Resources/Fixtures/stage0/agents/kimi/small.jsonl", "Resources/Fixtures/stage0/agents/kimi/assistant_tools.jsonl", "scripts/probe_scan_output/agent_watch/20260813-234646Z-prebump/report.json"]
          notes: "Bumped 0.31.1->0.34.0 after BUILDING the kimi_prompt prebump driver - kimi was the last actively-monitored agent with none, a gap the 2026-07-25 note had left open, and its weekly verdict had been stuck at blocked_stale_sample. The driver is fully SANDBOXED (no real_home_session, nothing written to the user's ~/.kimi-code): a bare KIMI_API_KEY is not enough because kimi's credential gate reads providerConfig.apiKey from the LOADED config.toml, so the driver normalises a forwarded key into kimi-code's own KIMI_MODEL_NAME/KIMI_MODEL_API_KEY contract, which the CLI guarantees (stripEnvModelConfig) is never written back to disk. It paid for itself immediately: staleness had been SHORT-CIRCUITING the schema verdict, hiding real 0.34.0 drift present in EVERY session - two new top-level wire types, profile.bind (fires after metadata) and turn.ended (fires per turn), plus event.step.end{providerFinishReason,rawFinishReason}. Both new types resolve to .meta through the existing catch-all, so no parser change; turn.ended.durationMs/reason are unread today and would be the natural source of a per-turn duration UI. Also added kimi's weekly discovery_path_contract, which it had never had."
      copilot:
        sessions:
          max_verified_version: "1.0.79"
          evidence: ["Resources/Fixtures/stage0/agents/copilot/small.jsonl", "scripts/probe_scan_output/agent_watch/20260813-235622Z-prebump/report.json"]
          notes: "Bumped 1.0.77->1.0.79 across two prebump rounds; the CLI auto-updated 1.0.78->1.0.79 BECAUSE our own prebump invoked it, so the first bump was re-validated at the new version rather than left behind. Drift closed: assistant.message.data{chunkCount,chunkIndex}. LATENT RISK, not a live bug: the Copilot parser never reads data.messageId and sets SessionEvent.messageID from the per-line envelope id, which is unique per line, so the transcript coalescer (which merges consecutive assistant blocks only when messageID matches) cannot reassemble a split message. Every record on disk is chunkIndex 0 / chunkCount 1, so nothing renders wrong today - but if Copilot ever emits chunkCount > 1 the fragments will render as separate assistant bubbles."
      cursor:
        sessions:
          max_verified_version: "2026.8.11"
          evidence: ["scripts/probe_scan_output/agent_watch/20260813-235842Z-prebump/report.json"]
          notes: "Bumped 2026.7.20->2026.8.11 in two steps for the same reason as Copilot: cursor-agent self-updated mid-session (2026.7.23, then 2026.8.11) because our prebump ran it, and each version was re-validated with a fresh passing run. No drift, no fixture change."
      antigravity:
        sessions:
          max_verified_version: "1.1.12"
          evidence: ["Resources/Fixtures/stage0/agents/antigravity/cli_small.jsonl", "scripts/probe_scan_output/agent_watch/20260813-235842Z-prebump/report.json"]
          notes: "UNBLOCKED after being HELD at 1.1.1 since 2026-08-03 (the hold reason was 'the only rich session predates the upgrade'). Rebuilding from all 20 sessions on disk closed 15 (bucket,key) pairs: the reported GENERIC type, an entirely new GREP_SEARCH record type never captured before, and truncated_fields on RUN_COMMAND/SYSTEM_MESSAGE. GENERIC resolves to .meta via the parser's default branch alongside CHECKPOINT/SYSTEM_MESSAGE - no code change - and its content carried the user's real permission-grant config, which the redactor correctly placeholdered. Also required a TARGET_FIXTURE entry for antigravity in rebuild_stage0_baseline.py, without which --emit could not run at all. agy self-updated 1.1.10->1.1.12 during our prebumps; the final verified version is the one actually validated."
      opencode:
        sessions:
          max_verified_version: "1.18.16"
          evidence: ["scripts/probe_scan_output/agent_watch/20260813-230922Z-prebump/report.json"]
          notes: "Bumped from fresh sandboxed prebump (fresh_matches_baseline=True); cleared blocked_stale_sample (sample_older_than_cli). No drift, no fixture change."
      pi:
        sessions:
          max_verified_version: "0.84.1"
          evidence: ["scripts/probe_scan_output/agent_watch/20260813-230922Z-prebump/report.json"]
          notes: "Bumped from fresh sandboxed prebump; cleared blocked_stale_sample. No drift, no fixture change. Note the driver warned that ~/.pi/agent/auth.json is older than 90 days - hygiene warning only, the run succeeded."
      openclaw:
        sessions:
          max_verified_version: "2026.7.1"
          evidence: ["~/.openclaw/agents/main/sessions/ (real 2026-07-22 user session, newer than the 2026-07-20 binary)", "scripts/probe_scan_output/agent_watch/20260814-000832Z/report.json"]
          notes: "Bumped 2026.6.11->2026.7.1 on WEEKLY LOCAL EVIDENCE, not a driver run - state this plainly, it is a weaker basis than every other bump in this entry. The evidence is a real user session written 2026-07-22, after the installed binary's 2026-07-20 mtime (openclaw does not log its version in sessions, so binary-mtime ordering is the only version evidence available), fingerprinting clean with unknown_types=[] and unknown_keys={} and not stale. Verdict is supports_installed_only with scope=installed; it is deliberately NOT claimed as latest despite installed == upstream, because no driver run backs it. THE DRIVER BLOCKER CHANGED and is now worse than auth: prebump fails MissingAgentHarnessError: Requested agent harness \"codex\" is not registered, before auth is even reached. ~/.openclaw/openclaw.json routes its ONLY model (openai/gpt-5.4) through agentRuntime.id \"codex\", and that harness ships in the external, non-bundled @openclaw/codex package, which is not installed (openclaw doctor: 'plugin not installed: codex'; the stock codex-supervisor plugin is a different thing and is disabled). This is machine-wide, verified against the real environment with no sandbox - meaning THE USER'S OWN main AGENT IS CURRENTLY BROKEN for its only configured model, not just our probe. Underneath it openclaw models status still reports openai:default expired, so installing the plugin alone would resurface the previously-documented dead-token failure. Human fix, both interactive: `openclaw plugins install @openclaw/codex`, then `openclaw models auth login --provider openai`. We deliberately did NOT reroute the probe to another model to make it pass - that would have hidden a real user-facing breakage. CORRECTION to earlier entries' shorthand: openclaw never read ~/.codex/auth.json; it has always kept its own auth profile for the same OpenAI account."
      hermes:
        sessions:
          max_verified_version: "0.17.0"
          notes: "UNCHANGED (verified == installed, so no bump was pending; upstream 0.20.1 is not installed). NEW FINDING: the hermes_oneshot driver now fails rc=1 with 'hermes -z: no final response was produced'. This is NOT our harness - the identical command fails the same way run by hand in the user's own environment with no sandbox. Hermes is configured with provider openai-codex against https://chatgpt.com/backend-api/codex, i.e. it borrows Codex's ChatGPT backend, which is the same class of dependency that blocks OpenClaw. Confirmed the failure is independent of the prompt: it fails with the tool-using prompt AND with the original 'Say hello in one sentence.', so hermes's prompt was deliberately left unchanged rather than shipping an unverifiable edit."
