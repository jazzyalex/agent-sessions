          max_verified_version: "1.0.77"
          evidence: ["Resources/Fixtures/stage0/agents/copilot/small.jsonl", "scripts/probe_scan_output/agent_watch/20260803-213316Z-prebump/report.json"]
          notes: "Bumped 1.0.65->1.0.77 after FIXING the copilot_prompt driver, which had been failing rc=1 with 'No authentication information found'. Two driver defects: it passed the deprecated --config-dir (copilot warns and points at COPILOT_HOME), and its declared credential_file ~/.copilot/hosts.json NO LONGER EXISTS, so with none of COPILOT_GITHUB_TOKEN/GH_TOKEN/GITHUB_TOKEN exported there was no auth path at all. Driver now sets COPILOT_HOME and falls back to the locally authenticated `gh auth token` - one of the three methods copilot's own error message lists. The working driver immediately paid for itself by finding real 1.0.77 drift: assistant.message.data gained encryptedContent+rte, tool.execution_start/complete gained rte, system.message gained interactionId, and session.auto_mode_resolved gained eight router-telemetry keys (routingMethod, availableModels, fallback, stickyOverride, routerLatencyMs, endToEndLatencyMs, chosenShortfall, hasImage). All additive keys, no new types, non-breaking. Fixture also moved session.auto_mode_resolved / session.usage_checkpoint into the BASELINE rather than schema_drift.jsonl, which is why those stopped re-reporting as drift every week, and now covers session.shutdown.data.tokenDetails{input,output,cache_read,cache_write} + totalNanoAiu - a usage surface nested fingerprinting exposed."
