          notes: "grok_single prebump ok=True, fresh_matches_baseline=True after the maintainer re-authenticated mid-sweep (the first run failed with 'Not signed in'). Substance confirmed rather than assumed: baseline_type_count 15 (non-zero, so a baseline was genuinely consulted and this is not the vacuous-compare bug that hit grok's first driver), 9 events at 0.667 coverage, unknowns empty. Upstream is 1.0.13 via the cask; installing it would require completing the install -> prebump -> verify loop, so it was left alone."

