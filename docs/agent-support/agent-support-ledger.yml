      - "2026-07-20 Claude session-format check. Bumped Claude 2.1.211->2.1.215 after clearing additive, non-breaking drift. Weekly first reported format_drift_detected on `effort` (assistant); a second run on a different sampled session surfaced `toolDenialKind` (user, values: permission-rule / user-rejected / automode-blocked), and a third surfaced `isAbortedMidStream` (assistant). Because the weekly scan fingerprints exactly ONE session per run, it reveals drift incrementally and each fix appeared to succeed while more remained. A full sweep of all local sessions from the last 30 days (union of top-level keys per type, diffed against the fixture baseline) found 43 missing key entries across 8 types plus 4 event types absent from fixtures entirely: frame-link, pr-link, started, result. All are additive; unknown keys are ignored by the parser and unknown types resolve to .meta via ClaudeSessionParser's fallback, so there was no data loss or UI regression at any point. Fixtures extended to cover all 43 (Stage0GoldenFixturesTests 24/24 pass). Prebump scripts/probe_scan_output/agent_watch/20260720-040959Z-prebump/report.json reports ok=True fresh_matches_baseline=True; weekly 20260720-040807Z returns claude to supports_installed_only/low."
      - "METHOD NOTE: do not treat one clean weekly run as proof the fixture baseline is complete. Single-session fingerprinting undercounts drift by construction — three consecutive runs here each reported a different single unknown key while 43 were outstanding. When drift is reported, sweep many sessions and diff the union against fixtures before declaring it cleared."
      - "Separately fixed a monitoring false positive in claude_usage_capture.sh: its login-detection guard matched the bare word `authentication`, which the Claude TUI prints in the unrelated banner 'N MCP servers need authentication'. That aborted the probe (exit 13, auth_required_or_cli_prompted_login) on a fully authenticated session before /usage ever ran, producing a spurious monitoring_broken verdict. Tightened the regex to login-specific phrases only; the probe now returns ok=true with a real reading. The over-broad bare terms `login` and `sign in` were removed too — `login` also false-positived on any cwd containing 'login'."
      - "Bumped Codex 0.144.5->0.144.6 from prebump scripts/probe_scan_output/agent_watch/20260720-042132Z-prebump/report.json (codex_exec, ok=True, fresh_matches_baseline=True, unknown_types=[] and unknown_keys={}, is_stale=false). No drift; no fixture change needed. Note the codex_status_probe threw one transient parsing_failed (exit 16) earlier in the session that did not reproduce across three direct runs plus two later weeklies — a flake, not a format change."
      - "Held at unchanged verified versions: Copilot 1.0.65, Hermes 0.17.0, Cursor 2026.6.24, OpenCode 1.18.3, Pi 0.80.10, Antigravity 1.0.16. OpenClaw remains blocked_stale_sample at 2026.6.11 (installed 2026.7.1): prebump failed again with refresh_token_reused. Confirmed this session that OpenClaw does NOT share ~/.codex/auth.json — it has its own auth_profile_store in openclaw-agent.sqlite — so `codex login` will not fix it, and a healthy Codex CLI is no evidence of OpenClaw auth health (codex exec succeeded the same minute OpenClaw 401'd, because Codex's access token was still valid and it never attempted a refresh)."
