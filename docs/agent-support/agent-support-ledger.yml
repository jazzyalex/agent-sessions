e twelfth source cannot repeat it; the pill array and the enablement-notice chain remain hand-listed and still open in the backlog. Kimi's pill takes no keyboard shortcut because Cmd-1..9 are fully allocated, the same posture as Hermes. Regression tests were confirmed to fail against the previous behaviour before the fix landed."
