# Agent Support Ledger (Append-Only)
#
# This file is the durable, versioned record of what Agent Sessions (AS) verified.
# Add a new entry for each AS release going forward. Do not rewrite history.
#
# Notes:
# - Some agents do not embed their own version in sessions. For those, store the
#   verified CLI version observed during evidence capture.
# - Claude + Codex include separate "usage/limits" channels which must be monitored.
#
entries:
  - agent_sessions_version: "5.1.0"
    as_of_date_utc: "2026-08-31"
    as_of_commit: "2f360432"
    note: "Fifth pass. Antigravity cleared once the maintainer created one real session; supersedes the hold in the entry below."
    verified:
      antigravity:
        sessions:
          max_verified_version: "1.1.22"
          scope: "supports_latest"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-172753Z-prebump/report.json"]
          notes: "Bumped 1.1.14->1.1.22 across an 8-version gap, held twice earlier today and released only when the evidence actually supported it. The maintainer created ONE real antigravity session (18 events), which lifted the newest-5 union from 19 events to 34 and cleared the thin-sample gate - the gate needs BOTH <25 events and <50% coverage, so the event count alone released it. That is the recovery path predicted in the sampling entry: real usage, not another prebump. Coverage is still only 0.308, so this is not a broad claim; what carries the bump is the separate prebump evidence, checked field by field rather than inferred from the verdict string: fresh_evidence_source=latest_prebump_report, latest_real_session_evidence=true, latest_status=current_fetch_known, blockers=[], and a sample mtime (17:10:18Z) later than the agy binary's (06:02:37Z), so the session was written by the installed build. unknown_types [] / unknown_keys {}. The underlying sampling weakness is NOT fixed - antigravity will fall back to blocked_thin_sample the next time five thin sessions lead the window - and remains filed against the sampling rule in docs/backlog.md."

  - agent_sessions_version: "5.1.0"
    as_of_date_utc: "2026-08-31"
    as_of_commit: "9b8f0dc4"
    note: "Fourth pass. Supersedes the copilot hold recorded two entries below; antigravity and openclaw remain held but for corrected reasons."
    verified:
      copilot:
        sessions:
          max_verified_version: "1.0.82"
          scope: "installed build; drift closed"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-172753Z-prebump/report.json"]
          notes: "Bumped 1.0.80->1.0.82, closing the last real drift in the set. Ordering was the whole point: `models` (on session.usage_checkpoint.data.promptCacheBreakState, keyed by model id - observed claude-haiku-4.5) went into _NESTED_OPAQUE_KEYS[copilot] BEFORE the baseline rebuild, so no model id ever entered the fixture. Third instance of that trap in one day after claude's `artifacts` and `modelUsage`. Baseline rebuilt over 13 sessions (17 pairs / 9 buckets); a fresh prebump on 1.0.82 then returned fresh_matches_baseline=True where the pre-rebuild run had returned False. LEFT UN-LISTED ON PURPOSE: session.shutdown.data.agentMetrics carries the single key `main`, which reads as a fixed role label rather than a user-chosen id and holds no user data - one observation only, so it is a judgement rather than a fact. If a multi-agent copilot session ever shows agentMetrics.<otherName>, list it then. VALUE PASS: reasoningBlocks {provider, blocks[{type,thinking,signature}]} is the model's thinking as structured data and the transcript renders none of it, while the equivalent Claude thinking blocks ARE rendered - filed as a candidate, 2 records in 13 sessions, measure before building. `signature` is a cryptographic attestation and must never be rendered."
    not_verified:
      antigravity:
        sessions:
          held_at_version: "1.1.14"
          installed_version: "1.1.22"
          reason: "blocked_thin_sample - previous diagnosis corrected"
          notes: "The entry below blames repeated real-home prebumps for the thin sample. Counting the store shows that is only half true: 31 transcripts on disk, 29 of them under 10 lines; the newest five total 19 events at 0.308 coverage, and while three are prebump artifacts, TWO are pre-existing 3-line sessions from 08-18 - the window would have been thin with zero prebumps. Root cause is the fixed _LOCAL_SCHEMA_SAMPLE_COUNT = 5 meeting a thin store: antigravity's only two substantial transcripts (60 and 81 lines) are excluded purely by age, so it is reported un-evidenced while its evidence sits unread. Filed against the sampling rule in docs/backlog.md, with an explicit warning not to simply raise the constant (SKILL 5a explains what it protects). Recovers on its own with real antigravity use."
      openclaw:
        sessions:
          held_at_version: "2026.7.1"
          installed_version: "2026.8.1"
          reason: "upstream bug, fix closed but not in stable"
          notes: "Corrected from 'fixable, theirs'. Upstream openclaw/openclaw#133881 and #133962, both CLOSED 2026-08-31, describe it exactly: doctor-owned state migrations are silently dropped while `doctor --fix` is named as the remedy. #133881's stated trigger is a running Gateway, and that does NOT apply here - the LaunchAgent is not loaded, no openclaw process is up, and the migration is still dropped - which points at #133962's hardcoded-mode path. The fix is not in stable: npm dist-tag latest is 2026.8.1 and the first build carrying it is 2026.9.1-beta.1. No duplicate issue filed. RETRY when npm latest moves past 2026.8.1. Hand-migrating is futile: the migration also covers ~/.openclaw/workspace-attestations/, so renaming <workspace>/openclaw-workspace-state.json changes nothing (tried and reverted)."

  - agent_sessions_version: "5.1.0"
    as_of_date_utc: "2026-08-31"
    as_of_commit: "50df8129"
    note: "Second pass the same day, after the maintainer re-authenticated pi, antigravity and grok and confirmed opencode works interactively. Four of the five agents held in the first pass cleared; two new findings appeared."
    verified:
      opencode:
        sessions:
          max_verified_version: "1.18.25"
          scope: "supports_latest"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-170957Z-prebump/report.json"]
          notes: "Bumped 1.18.21->1.18.25. THE FIRST PASS'S 'PROVIDER-SIDE OUTAGE' VERDICT WAS WRONG and is corrected here. opencode_run kept returning {\"name\":\"UnknownError\",\"message\":\"Unexpected server error\"} with a fresh ref each run, which read as a vendor 500. Running the driver's exact command (`opencode run --pure --format json --dir <tmp>`) against the REAL environment produced a complete session with a real tool call - so the failure was ours, in the sandbox. Cause: `agents.opencode.prebump.credential_files` was EMPTY, and the only auth path left was env-var-first over ANTHROPIC/OPENAI/GEMINI/GROQ/OPENROUTER API keys, none of which are set on a machine using OAuth. The sandbox therefore had no credentials at all and OpenCode's backend reported that as an opaque UnknownError rather than a 401. Fixed by adding ~/.local/share/opencode/auth.json to credential_files (0600, 3.5KB, passes all three hygiene gates). Prebump then returned ok=True / fresh_matches_baseline=True immediately. LESSON: an opaque server error is not evidence of a server problem - run the driver's own command against real HOME before concluding the vendor is down."
      pi:
        sessions:
          max_verified_version: "0.84.4"
          scope: "supports_latest"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-171109Z/report.json"]
          notes: "Bumped 0.84.3->0.84.4 the same day as the 0.84.2->0.84.3 bump, because pi SELF-UPDATED between the two prebump runs - the SKILL 1b 're-read the installed version after the run' case, live. Checked rather than assumed before claiming it: the pi binary's mtime is 2026-08-31T16:02:51Z and the prebump session's is 17:08:35Z, so the session was written by 0.84.4, not the 0.84.3 that was installed when the run started. Weekly agrees: fresh_evidence_source=latest_prebump_report, latest_real_session_evidence=true, supports_latest. The >90-day credential warning on ~/.pi/agent/auth.json cleared after the maintainer re-authenticated."
      grok:
        sessions:
          max_verified_version: "1.0.13"
          scope: "supports_latest"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-171039Z-prebump/report.json"]
          notes: "Bumped 1.0.5->1.0.13. No install was needed - grok had already self-updated to 1.0.13 (5e9a58528b76) by the time the loop began, which is why the first pass's passing prebump could not be reused: it ran against 1.0.5. Re-ran on 1.0.13 and confirmed the report was the new one rather than a stale read (different session id fb91702d vs 12dfe162, report 171039Z). Substance confirmed: baseline_type_count 15 (non-zero, so a baseline was genuinely consulted), 9 events at 0.667 coverage, unknowns empty. The identical event/coverage numbers across runs are the same one-shot prompt, not a cached result."
    not_verified:
      copilot:
        sessions:
          held_at_version: "1.0.80"
          installed_version: "1.0.82"
          reason: "format_drift_detected - unchanged from the first pass"
          notes: "See the first-pass entry below. Still held; promptCacheBreakState.models must be opaque-listed before any copilot baseline rebuild."
      antigravity:
        sessions:
          held_at_version: "1.1.14"
          installed_version: "1.1.22"
          reason: "blocked_thin_sample - and this sweep is what caused it"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-171109Z/report.json"]
          notes: "After the maintainer logged in, antigravity_print went from rc=1 to ok=True / fresh_matches_baseline=True - so the earlier 'permission check failed for command ls -la' was a symptom of being logged out, not a driver defect. But the agent still cannot be bumped, and the reason is self-inflicted: antigravity is real_home_session, so each prebump session lands in the real store and enters the newest-_LOCAL_SCHEMA_SAMPLE_COUNT window. Running it repeatedly today pushed the weekly union down to 19 events at 0.308 coverage and flipped the verdict to blocked_thin_sample - all five sampled files are prebump transcripts. This is EXACTLY the degradation SKILL 1a warns about, reproduced by following the rest of the procedure correctly. The prompt is already tool-using ('Say hi, then list the files in the current directory using your tools'), so the prompt is not the lever; the lever is not running real-home prebumps repeatedly against an agent with a thin real store. To close: let real antigravity usage refill the newest-5 window, then re-run the weekly - do NOT re-run prebump to try to fix it."
      openclaw:
        sessions:
          held_at_version: "2026.7.1"
          installed_version: "2026.8.1"
          reason: "the agent's own config is invalid after its self-update - fixable, theirs"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-171501Z-prebump/report.json"]
          notes: "openclaw self-updated 2026.7.1 -> 2026.8.1 during the day and went blocked_stale_sample. openclaw_local_agent then failed rc=1, and NOT on format or auth: 2026.8.1 rejects the user's existing config. Reported keys include gateway.reload.mode (now only off|hybrid), gateway.reload.debounceMs, cron.maxConcurrentRuns, commands.ownerDisplay and gateway.tailscale.resetOnExit, plus retired layout aliases and tuning knobs. openclaw names its own remedy - `openclaw doctor --fix` - which rewrites the maintainer's config, so it was left for them to run rather than executed from a sweep. SKILL 1c category two: fixable, theirs. Re-run prebump after the config migration."
      devin:
        sessions:
          held_at_version: "3000.5.20 (2d902011)"
          reason: "steward-verified; not installed on this machine - NOT a maintainer finding"
          notes: "Reports latest_unknown / cli_binary_unresolved, which is the correct and expected output for an agent that is not installed here. STEWARDS.md records @thedavidweng as steward, last verified 2026-08-27 on 3000.5.20. The scan cannot tell 'broken' from 'not installed', so it had been surfacing devin and fx as maintainer gaps for a full sweep. SKILL 1g now states the rule: read the tier first, state it beside the verdict, judge the steward's DATE rather than the schema, and ping rather than investigate. Do not install the CLI to close it - a maintainer install with no sessions produces no better evidence."
      fx:
        sessions:
          held_at_version: "0.0.5"
          reason: "steward-verified; not installed on this machine - NOT a maintainer finding"
          notes: "Same as devin: @thedavidweng, last verified 2026-08-27 on 0.0.5. Its discovery contract 'fails' with error no_local_file, which for a steward-owned absent agent means only that ~/.fx/sessions does not exist here - it is not a contract breach and must not be reported as one."

  - agent_sessions_version: "5.1.0"
    as_of_date_utc: "2026-08-31"
    as_of_commit: "e27ea63b"
    verified:
      codex:
        sessions:
          max_verified_version: "0.151.0"
          scope: "tier-1 support unchanged; multi-agent/subagent family covered"
          evidence: ["Resources/Fixtures/stage0/agents/codex/small.jsonl", "scripts/probe_scan_output/agent_watch/20260831-060445Z/report.json"]
          notes: "Bumped 0.149.0->0.151.0 on real local sessions written BY 0.151.0 today (5636 events, sample_older_than_cli=false), not on a prebump. 0.151 is a multi-agent release: item_completed items gain agent_path/agent_thread_id on a SubAgentActivity kind, session_meta gains subagent_history_start_ordinal/thread_source/multi_agent_version/forked_from_id, world_state.state gains context_window_guidance + empty persistent_mode/managed_developer_instructions, and message metadata gains content_item_kinds. All additive; unknown types reach .meta via SessionEvent.from's terminal fallback, verified end-to-end by the five drifted sessions being indexed with 38-48KB of extracted text each. Fixture rebuilt over 1190 sessions (31 missing pairs across 10 buckets). VALUE PASS: the sweep's headline finding is NOT the new fields - it is that 0.151 moved subagent identity off agent_role onto agent_path/agent_nickname, leaving agent_role null on 80 of 287 thread_spawn subagents (27.9%) so their session-list badge renders blank, while CodexRunwayModel.swift:1899 already reads agent_nickname and names them in the HUD. Filed. agent_thread_id was investigated as a hierarchy source and REJECTED: parent_thread_id is already read at SessionIndexer.swift:2039, and 11 of 53 SubAgentActivity items point at the PARENT, so edge-derivation from it inverts them. content_item_kinds filed; ordinal/context_window_guidance/persistent_mode/managed_developer_instructions/subagent_history_start_ordinal recorded as watch."
      claude:
        sessions:
          max_verified_version: "2.1.251"
          scope: "tier-1 support unchanged; three additive keys covered"
          evidence: ["Resources/Fixtures/stage0/agents/claude/small.jsonl", "scripts/probe_scan_output/agent_watch/20260831-060445Z/report.json"]
          notes: "Bumped 2.1.239->2.1.251 on real local sessions written BY 2.1.251 (2924 events, stale=false). New keys: attachment:deferred_tools_delta.failedMcpServers (empty [] in all 29 observations), queue-operation.reason (only value absorbed_mid_turn), user.queueSkipAttachments (always true). All additive, all recorded as watch/noise. Fixture rebuilt over 1910 sessions; the gap was 60 pairs across 17 buckets BEFORE an opaque-key fix and 23 across 8 after. CRITICAL, caught one emit before it shipped: artifact-autoreact-ledger.artifacts and artifact-comment-monitor.artifacts are maps keyed by ARTIFACT UUID. _redact blanks values but never dict KEYS, so emitting would have written real artifact ids into a committed public fixture as if they were schema, after which every artifact any user ever created would report as Claude drift forever - the collab_waiting_end.statuses failure repeating. `artifacts` is now in _NESTED_OPAQUE_KEYS[claude] and emits as an empty dict. Pinned generally by Stage0GoldenFixturesTests.testCommittedFixturesCarryNoIdentifierShapedDictKeys, which scans every committed fixture for UUID-shaped dict keys so the next unlisted id-keyed map fails in CI instead of shipping."
      cursor:
        sessions:
          max_verified_version: "2026.8.25"
          scope: "supports_latest - fresh session from the installed build matches baseline"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-060234Z-prebump/report.json"]
          notes: "Bumped 2026.8.11->2026.8.25. cursor_agent_print prebump ok=True, fresh_matches_baseline=True, run with --allow-real-home (real_home_session). Weekly verdict supports_latest, installed == upstream == 2026.8.25, unknown_types [] / unknown_keys {}. Sample is 21 events at 0.667 coverage - above the thin gate on coverage, and the prebump is what carries the claim."
      pi:
        sessions:
          max_verified_version: "0.84.3"
          scope: "installed build only; upstream 0.84.4 is newer and unverified"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-060144Z-prebump/report.json"]
          notes: "Bumped 0.84.2->0.84.3, deliberately to INSTALLED and not to upstream 0.84.4: a bump claims the app parses sessions written by that build, and nothing has produced a 0.84.4 session. pi_prompt prebump ok=True, fresh_matches_baseline=True. Driver warned that /Users/<user>/.pi/agent/auth.json is older than 90 days; it still authenticated, but expect a re-auth prompt on a future run."
      kimi:
        sessions:
          max_verified_version: "0.39.1"
          scope: "supports_latest - fresh session from the installed build matches baseline"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-060144Z-prebump/report.json"]
          notes: "Bumped 0.38.0->0.39.1. kimi_prompt prebump ok=True, fresh_matches_baseline=True; weekly supports_latest with 468 events at 0.8125 coverage, the strongest sample in this pass. Also closed a stale backlog entry claiming kimi has no prebump driver - KimiPromptDriver has existed since 15a7f21b (2026-08-14); the entry was stamped `verified —` and had never been re-checked."
    not_verified:
      copilot:
        sessions:
          held_at_version: "1.0.80"
          installed_version: "1.0.82"
          reason: "format_drift_detected, confirmed by BOTH prebump and weekly - not bumped"
          evidence: ["scripts/probe_scan_output/agent_watch/20260831-060234Z-prebump/report.json"]
          notes: "copilot_prompt prebump ok=True but fresh_matches_baseline=FALSE - a session written by the installed 1.0.82 does not match baseline. This is the case prebump exists for: the weekly had been reporting blocked_stale_sample, which per SKILL 5a means UNKNOWN and was hiding real drift. New: assistant.message.data.reasoningBlocks{provider, blocks{signature,thinking,type}} - reasoning/thinking content the transcript does not render, a value-pass candidate; session.shutdown.data.agentMetrics.main{modelMetrics,totalApiDurationMs,totalNanoAiu}; session.usage_checkpoint.data.promptCacheBreakState{conversation,lastActiveModel,models,pendingRewriteSources}; user.message.data.turnId. WARNING before any copilot baseline rebuild: promptCacheBreakState.models is keyed by MODEL ID (observed key: claude-haiku-4.5) - it must go into _NESTED_OPAQUE_KEYS[copilot] alongside the existing modelMetrics, or every new model will read as copilot drift, the same failure just caught on Claude's artifacts map."
      antigravity:
        sessions:
          held_at_version: "1.1.14"
          installed_version: "1.1.22"
