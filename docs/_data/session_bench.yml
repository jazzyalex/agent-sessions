gates:
- id: S1
  area: Signal
  name: Lean session
  desc: The identical one-line probe task adds ≤ 10 KB to the store (incremental bytes;
    database cold-start allocation is reported separately, not scored).
- id: S2
  area: Signal
  name: Content-key share
  desc: Strings under a published list of content-like keys (text, content, message,
    thinking, output, result, …) are ≥ 25% of stored bytes (corpus measurement). This
    heuristic captures real work product — messages, reasoning, tool output — but
    also counts bookkeeping stored under those keys, noted per-agent where known (Codex
    world_state, Copilot system prompt). Format-specific per-event classifiers are
    a 1.0 milestone.
- id: S3
  area: Signal
  name: No fixed-cost dumps
  desc: No single per-session bookkeeping record over 25 KB (system-prompt dumps,
    tool-catalog snapshots, context snapshots) in recent real sessions.
- id: C1
  area: Completeness
  name: Per-event timestamps
  desc: Every event carries a timestamp.
- id: C2
  area: Completeness
  name: Model attributable
  desc: The model behind every assistant message is recoverable from the record.
- id: C3
  area: Completeness
  name: Token usage recorded
  desc: Token counts are written locally.
- id: C4
  area: Completeness
  name: Dollar cost recorded
  desc: A dollar cost figure is written locally (premium-request counters do not pass).
- id: C5
  area: Completeness
  name: Tool calls and outputs
  desc: Both the tool invocation and its output are in the record.
- id: C6
  area: Completeness
  name: Readable rationale
  desc: A readable account of the model's reasoning survives in the record — raw thinking
    or a stored summary beyond the final answer. Sealing may be deliberate vendor
    policy; the gate scores what the record contains, not the policy's merits.
- id: C7
  area: Completeness
  name: Thread structure
  desc: Threads, branches, or subagent runs are recoverable via links or artifacts.
- id: T1
  area: Stability
  name: No schema break
  desc: No breaking schema change while under observation. Observation windows differ
    per harness (stated in each cell); a window too short to establish stability scores
    not_run.
- id: T2
  area: Stability
  name: Declares a format version
  desc: 'The artifact declares the version of its session FORMAT — a schema/protocol
    version an external reader can dispatch on. An application/CLI version stamped
    in the artifact does not pass: it identifies the writer, not the schema (tightened
    in v0.3; v0.2 wrongly accepted writer versions).'
- id: T3
  area: Stability
  name: Honest version signal
  desc: 'The declared version matches the shipped reality. Scored only when T2 passes:
    with no version signal there is nothing to judge, and absence is already penalized
    by T2 (changed in v0.2 — v0.1 wrongly awarded this point to harnesses with no
    version at all).'
- id: O1
  area: Openness
  name: Standard-tools readable
  desc: Readable at rest with a text editor or sqlite3; protobuf or hex-encoded payloads
    fail.
- id: O2
  area: Openness
  name: Live-tailable
  desc: One artifact you can tail -f holds the full running record.
- id: O3
  area: Openness
  name: Documented schema
  desc: The vendor publishes documentation for the session format.
- id: O4
  area: Openness
  name: Stable location
  desc: No wholesale storage-layout migration in the observation window.
- id: P1
  area: Tooling
  name: Naive-reader safe
  desc: A reader following the obvious structure gets every message exactly once.
- id: P2
  area: Tooling
  name: Crash tolerant
  untested: true
  desc: 'A truncated final write costs at most one record. UNSCORED in v0.2: asserted
    by format family only; needs a cross-harness truncation experiment (a 1.0 milestone).'
- id: P3
  area: Tooling
  name: Self-contained
  desc: No sidecar file join is needed for title, cwd, or model.
